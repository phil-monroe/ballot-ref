# TODO: set to the real GitHub repository URL once it exists (used for "Report an error" links)
repo_url: https://github.com/OWNER/ballot-reference
quote_max_words: 25
stale_days: 7
symmetry_threshold: 2
priorities_per_candidate: 3
key_vote_count: 10
model:
  # "claude-cli" uses your Claude Code login (no API key); "anthropic" uses ANTHROPIC_API_KEY.
  provider: claude-cli
  id: claude-sonnet-5-5
  # cli_path: /Users/you/.local/bin/claude   # only if `claude` is not on PATH
prompt_versions:
  candidate: v2
  issue: v1
  judicial: v1
rate_limit_seconds: 2
user_agent: "ballot-ref/0.1 (+https://github.com/OWNER/ballot-reference; sourced voter reference)"
