        sources:
          - { title: "Ohio Capital Journal: BGSU poll finds statistical tie in governor's race", url: "https://ohiocapitaljournal.com/2026/10/02/still-anyones-ball-game-bowling-green-poll-finds-statistical-tie-in-ohios-race-for-governor/" }
          - { title: "WOSU: Ohio 2026 election guide", url: "https://www.wosu.org/2026-10-06/ohio-2026-election-guide-what-voters-need-to-know-about-their-ballots" }

      - id: "attorney-general"
        type: "candidate_race"
        ballot_order: 2
        office: "Attorney General"
        term: "Four years"
        contested: true
        what_the_office_does: "Ohio's chief lawyer and top law enforcement officer. Represents the state in court, enforces consumer protection, and reviews summary language for citizen petitions to amend the constitution. Andy Wilson is interim AG after Dave Yost resigned in June."
