            website: "https://vivekforohio.com/"
            priorities:
              - "Cut property taxes immediately and phase out the state income tax, starting with capital gains"
              - "Lower electric bills by expanding natural gas and other energy and streamlining permits"
              - "World-class education: raise standards, parent choice, pay top teachers more"
              - "Protect neighborhoods: stricter bail and sentencing for repeat violent offenders, back the police"
