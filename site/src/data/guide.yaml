sections:

  # ---------------------------------------------------------------- FEDERAL
  - id: "federal"
    title: "Federal Races"
    contests:

      - id: "us-senate-special"
        type: "candidate_race"
        ballot_order: 8
        office: "U.S. Senator"
        term: "Unexpired term ending Jan. 3, 2029"
        contested: true
        what_the_office_does: "Senators write and vote on federal laws, confirm federal judges and Cabinet officials, and ratify treaties. The winner serves the last two years of JD Vance's term."
        race_status: "Toss-up per polling roundups; recent polls show Brown slightly ahead, mostly within margin of error."
        polls:
          - { pollster: "NYT/Siena", dates: "Sept. 22 - Oct. 1, 2026", population: "616 likely voters", result: "Brown 49%, Husted 46%" }
          - { pollster: "Marist", dates: "n/a", population: "registered voters", result: "Brown 51%, Husted 43%" }
          - { pollster: "BGSU", dates: "earlier", population: "n/a", result: "Brown 49%, Husted 48%" }
        candidates:
          - name: "Jon Husted"
            website: "https://jonhustedforsenate.com/"
            priorities:
              - "Jobs and economic development: cites bringing Intel's chip plant to Licking County and business-driven job training (TechCred)"
              - "Cutting government waste and costs: cites InnovateOhio and moving driver's license and title services online"
              - "Support for law enforcement funding"
              - "Fiscal conservatism: cites the largest income tax cut in Ohio history while House Speaker"
              - "Pro-life: describes himself as a champion for life"
            priority_details:
              - title: "Economy and jobs"
                summary: "Says he helped land Intel's chip plant in Licking County, the largest economic development deal in state history, and pioneered business-driven job training such as TechCred and Industry Sector Partnerships."
              - title: "Regulatory reform and efficiency"
                summary: "As Lt. Governor, says he led regulatory reform to cut fraud and waste and save millions, and founded InnovateOhio to reduce costs through digital services such as online license renewal and title transfer."
              - title: "Law enforcement"
                summary: "Says he is a proud supporter of police and worked to secure millions in funding for law enforcement agencies. The site also touts endorsements from 75 county sheriffs and the Fraternal Order of Police."
              - title: "Fiscal record"
                summary: "As House Speaker, says he led the most fiscally conservative budget in 40 years and what was then the largest income tax cut in Ohio history; as Secretary of State, says he made Ohio the least costly Midwest state to start a business."
              - title: "Pro-life"
                summary: "Calls himself a champion for life, citing his own start in foster care before adoption."
              - title: "Trump endorsement priorities"
                summary: "A press release says President Trump endorsed him to secure the border, fight inflation and champion common-sense values (the campaign's characterization of the endorsement)."
            priorities_note: "The campaign site has no issues or platform page. These come from its Bio page and press releases; its coalitions page (law enforcement, 2A, faith leaders, sportsmen, farmers, veterans) lists audiences, not positions."
            party: "Republican"
            incumbent: true
            summary: "Appointed to the seat by Gov. DeWine in January 2025. Previously 20+ years as a state lawmaker and statewide officeholder, most recently Lieutenant Governor."
            money:
              - "Reported $7.7 million raised in Q2 2026 across affiliated committees, including $3.4 million in the main committee; more than $11 million cash on hand (campaign claim: largest Q2 ever for an Ohio Republican Senate candidate)."
              - "Senate Leadership Fund super PAC plans to spend $79 million on the race."
              - "Legis1 (secondary source): FEC data through Q4 2025 showed 584 unique itemized donors to his network vs. 6,700+ for Brown."
              - "Ohio Capital Journal reported two Jane Street Capital executives gave a combined $637,200 through his joint fundraising committee, Husted Victory."
            support:
              - "Long executive experience in state government"
              - "Would keep a Republican Senate seat and the Republican majority"
              - "Strong backing from business donors and national Republicans; President Trump expected to campaign for him"
            oppose:
              - "Brown's campaign ties him to Ohio's House Bill 6 bribery scandal (campaign attack; Husted was not charged in that case)"
              - "Criticized for long support of data centers"
              - "Narrower itemized donor base; large donations from a small number of executives"
            sources:
              - { title: "Ohio Capital Journal: Brown outraises Husted as outside groups enter Senate race", url: "https://ohiocapitaljournal.com/2026/07/29/sherrod-brown-comfortably-outraises-jon-husted-as-outside-groups-enter-ohios-u-s-senate-race/" }
              - { title: "Legis1: The Money Race Shaping Ohio's 2026 Senate Election (secondary)", url: "https://legis1.com/news/ohio-2026-senate-election-the-money-race-shaping" }
              - { title: "NBC4: Husted, Brown set stage for Ohio's 2026 U.S. Senate race", url: "https://www.nbc4i.com/news/your-local-election-hq/husted-brown-set-stage-for-ohios-2026-u-s-senate-race/" }
          - name: "Sherrod Brown"
            website: "https://www.sherrodbrown.com/"
            priorities:
              - "Hold health insurers accountable: ban denials of care a doctor prescribes, with fines for improper denials"
              - "Lower prescription drug costs: bar drug companies from charging Americans more than other countries"
              - "Make data centers pay the full cost of their utilities, with local say over whether they are built"
              - "Cap utility rate increases"
              - "Ban stock trading by members of Congress and their spouses, and bar them from lobbying after leaving office"
            priority_details:
              - title: "Holding health insurance companies accountable"
                summary: "Ban insurers from denying care a doctor says you need, and fine them if they try to deny claims."
              - title: "Bringing down prescription drug costs"
                summary: "Make it illegal for drug companies to charge Americans more than they charge in other countries."
              - title: "Making data centers pay"
                summary: "Require data centers to pay the full cost of their utilities, and let Ohioans decide whether data centers are built in their communities. Criticizes tax breaks Husted gave to data-center companies."
              - title: "Capping utility rate increases"
                summary: "Cap how much utility companies can raise rates so bills are affordable and predictable."
              - title: "Banning congressional stock trading and lobbying"
                summary: "No member of Congress or spouse should trade stocks, and former members should not become lobbyists."
            priorities_note: "The site's only issues page, 'Our Fight', frames these as fixes to a 'rigged' system and a high cost of living."
            party: "Democratic"
            incumbent: false
            summary: "U.S. Senator 2007-2025; lost in 2024 to Bernie Moreno."
            money:
              - "$17.1 million raised in Q2 2026, including $14.1 million to Friends of Sherrod Brown; more than $5.1 million via ActBlue."
              - "Senate Majority PAC has committed $64 million."
            support:
              - "Long record on workers and trade"
              - "History of winning votes from both parties"
              - "Opposes data-center expansion"
              - "Heavy small-donor support"
            oppose:
              - "Husted's campaign calls him Chuck Schumer's 'handpicked candidate'"
              - "Critics say Ohio voters already rejected him in 2024 and that he would add to a Democratic majority"
              - "Critics question how grassroots his large outside money truly is"
            sources:
              - { title: "Yahoo/AP: Sherrod Brown expected to seek a return to the US Senate in 2026", url: "https://www.yahoo.com/news/articles/sherrod-brown-ohio-highest-profile-194533033.html" }
              - { title: "PBS NewsHour: Sherrod Brown expected to seek his return to the Senate in 2026", url: "https://www.pbs.org/newshour/politics/sherrod-brown-expected-to-seek-his-return-to-the-senate-in-2026" }
              - { title: "Ohio Capital Journal: Brown outraises Husted", url: "https://ohiocapitaljournal.com/2026/07/29/sherrod-brown-comfortably-outraises-jon-husted-as-outside-groups-enter-ohios-u-s-senate-race/" }
          - name: "William B. Redpath"
            website: "https://billredpath.com/"
            priorities:
              - "Repeal all tariffs (unilateral free trade)"
              - "Cut federal spending: eliminate the Departments of Education and HUD, end corporate welfare and farm subsidies"
              - "Replace the tax code with a 20% flat tax and a family allowance"
              - "Avert the debt crisis by reforming Social Security, Medicare and Medicaid"
              - "Open immigration: allow all but criminals, terrorists and security risks"
            priority_details:
              - title: "War with Iran"
                summary: "Calls U.S. participation unconstitutional and says Trump should be impeached for acting without Congress. Wants the 'special relationship' with Israel ended and the Middle East treated with 'benign neglect'."
              - title: "Repeal all tariffs"
                summary: "Unilateral free trade: end all tariffs on imports regardless of other nations' policies."
              - title: "Immigration"
                summary: "Allow all immigration except criminals, terrorists, the seriously ill or others who would harm people's rights; the burden of proof should be on government."
              - title: "Stop the forthcoming debt crisis"
                summary: "Federal debt is a spending problem. Favors a BRAC-style commission for Social Security reforms voted up or down; reform Medicare into cash payments to enrollees; phase out federal Medicaid subsidies over ten years and turn it over to the states."
              - title: "Reduce federal spending"
                summary: "Eliminate the Departments of Education and HUD and end corporate welfare and farm subsidies, immediately or over at most ten years."
              - title: "Tax reform"
                summary: "Scrap the Internal Revenue Code for the Tax Foundation's plan: a 20% flat individual tax with a family allowance, a 20% distributed-profits tax for businesses, and no taxes at death."
              - title: "Electoral reform"
                summary: "Ranked-choice voting for single-winner elections, the Fair Representation Act for multi-member House districts, and the National Popular Vote compact."
              - title: "Repeal victimless-crime laws"
                summary: "Repeal federal laws on consensual crimes, ending drug prohibition and the ban on online gambling and leaving drug policy to the states."
            priorities_note: "Drawn from the 'What I Stand For' issues page and the home page."
            party: "Libertarian"
            incumbent: false
            summary: "On the ballot. Almost no coverage found; platform not verified. Libertarian candidates generally run on smaller government and civil liberties."
            verification: "unverified"
            sources:
              - { title: "Ballot (official)", url: "https://lookup.boe.ohio.gov/vtrapp/delaware/getballot.aspx?elect=20261103g_webeix0&prsid=154___1&bpty=X" }
          - name: "Greg Levy"
            website: "https://www.greg4senate.com/"
            priorities:
              - "Bring the 100 largest corporations into public ownership under democratic worker control"
              - "Make basics constitutional rights: national rent cap (no more than 20% of income), eviction ban, single-payer health care, cancelled student debt, free education"
              - "Price freeze on essential goods; repeal the 2025 federal tax cuts"
              - "Outlaw corporate lobbying and donations; set Congress's pay to the median worker's wage"
              - "Abolish ICE and cut the Pentagon budget by 90%"
            priority_details:
              - title: "Build a new economy that meets our needs"
                summary: "Public ownership of the 100 largest corporations under worker control; rent cap, eviction ban, single-payer health care, cancelled student debt, free pre-K-through-college education, a price freeze on essentials, repeal of the 2025 tax cuts, a socialist industrial policy, and 20 million union jobs nationwide."
              - title: "Build a democracy for the working class"
                summary: "Outlaw corporate lobbying and political donations, prosecute the powerful, set congressional pay at the median worker wage, and move to abolish the Senate and the Supreme Court in favor of bodies controlled by workers' organizations."
              - title: "End the war on Black America"
                summary: "Reparations for slavery and Jim Crow, federal investment in historically oppressed communities, community control of police, prosecution of police violence, and an end to gerrymandering and voter purges."
              - title: "Stop the forever wars"
                summary: "Cut the Pentagon budget by 90%, close 800+ overseas bases, dissolve NATO, the CIA and AFRICOM, create a union-wage 'People's Corps' for veterans, cut all aid to Israel and lift sanctions on nations like Cuba, Venezuela and Iran."
              - title: "Fight the real enemies (immigrants, women, LGBTQ rights)"
                summary: "Abolish ICE, end raids and deportations, create a path to citizenship, guarantee free abortion and access to gender-affirming care, and ban discrimination in housing and employment."
              - title: "Save the planet from capitalism"
                summary: "A planned economy: public transit, sustainable agriculture, manufacturing for renewable technology, a smaller Pentagon, and climate reparations."
            priorities_note: "Describes itself as a socialist campaign (Party for Socialism and Liberation); the platform page lists six planks."
            party: "Other party (as printed on ballot)"
            incumbent: false
            summary: "On the ballot. Almost no coverage found; platform not verified."
            verification: "unverified"
            sources:
              - { title: "Ballot (official)", url: "https://lookup.boe.ohio.gov/vtrapp/delaware/getballot.aspx?elect=20261103g_webeix0&prsid=154___1&bpty=X" }
        sources:
          - { title: "Newsweek: Half of Ohio voters 'strongly disapprove' of Trump as Brown opens lead", url: "https://www.newsweek.com/ohio-disapprove-donald-trump-sherrod-brown-poll-12500125" }
          - { title: "Newsweek: Sherrod Brown's polling lead defies Ohio's Republican shift", url: "https://newsweek.com/sherrod-browns-polling-lead-defies-ohios-republican-shift-12532271" }
          - { title: "StatedRecord: Ohio Senate Special Election 2026", url: "https://statedrecord.com/races/ohio-us-senate-special-2026" }
          - { title: "PollsMax: 2026 Ohio Senate Polls", url: "https://www.pollsmax.com/senate/ohio/" }
          - { title: "RealClearPolitics: Husted vs. Brown", url: "https://www.realclearpolitics.com/epolls/2026/senate/oh/2026_ohio_senate_special_election_husted_vs_brown-8689.html" }
          - { title: "WOSU: Ohio 2026 election guide", url: "https://www.wosu.org/2026-10-06/ohio-2026-election-guide-what-voters-need-to-know-about-their-ballots" }

      - id: "us-house-oh-12"
        type: "candidate_race"
        ballot_order: 9
        office: "U.S. Representative, 12th District"
        term: "Two years"
        contested: true
        what_the_office_does: "House members write federal laws, control federal spending, and represent about 800,000 constituents."
        race_status: "Cook Political Report: Solid Republican."
        candidates:
          - name: "Troy Balderson"
            website: "https://baldersonforcongress.com/"
            priorities:
              - "Secure the border: more border patrol and technology, go after cartels, end sanctuary cities"
              - "Energy: streamline permits, build pipelines, lift the LNG export ban, roll back green-energy policies"
              - "Lower inflation, cut taxes and reduce federal spending"
              - "Stand up to China and reduce dependence on it"
              - "Support veterans: modernize the VA and let veterans choose their doctors"
            priority_details:
              - title: "Securing our border"
                summary: "Close the open border, go after cartels, invest in detection technology, hire more border patrol agents, end sanctuary cities, driver's licenses and discounted tuition for illegal immigrants, and stop welfare payments to them."
              - title: "Restoring energy dominance"
                summary: "Streamline permits, build pipelines, repeal the 'green agenda', unleash domestic resources, and let consumers choose their vehicles."
              - title: "Unleashing American energy"
                summary: "Acknowledge natural gas's role in reducing emissions, lift the LNG export ban, and build pipelines and energy infrastructure."
              - title: "Rebuilding the economy"
                summary: "Lower inflation, cut taxes, stop deficit spending, produce and build products in America, and reduce supply-chain dependence on China."
              - title: "Standing up to China"
                summary: "Force the sale of TikTok to an American company, bring critical manufacturing home, and reverse the EV mandate, citing China's role in rare-earth processing."
              - title: "Supporting veterans"
                summary: "Modernize the VA, let veterans choose doctors in their communities, protect their Second Amendment rights, remove 'woke' agenda at DOD and VA, and streamline benefits."
              - title: "Caring for people (health care)"
                summary: "Oppose more government control of health care; embrace digital health innovation, protect seniors and people with pre-existing conditions, and give patients choice and flexibility."
              - title: "Saving our jobs"
                summary: "Restore the Trump middle-class tax cuts before they expire, cut regulations, level the field against China, expand rural high-speed internet, and end the stigma that you need a college degree to get ahead."
              - title: "Protecting our families (public safety)"
                summary: "Hold 'rogue' prosecutors and judges accountable, secure the border against drugs and criminals, hire more police and fund police departments."
            priorities_note: "The site lists nine issue areas, with some overlap between energy sections."
            party: "Republican"
            incumbent: true
            summary: "In Congress since a 2018 special election. Former state senator and representative. Third-generation auto dealer from Zanesville."
            money:
              - "FEC through June 30, 2026: $1,743,281 raised; $1,982,352 cash on hand."
            support:
              - "Experience and seniority"
              - "Conservative record that fits the district"
              - "Large financial edge"
            oppose:
              - "Democrats call him a reliable party-line vote"
              - "Campaign claim (not independently verified): only 33% of his money comes from Ohio vs. 67% of Christian's"
            sources:
              - { title: "Know Your Reps: Ohio's 12th District 2026", url: "https://knowyourreps.io/races/2026/ohio/district-12" }
              - { title: "Smarter.vote: Ohio's 12th Congressional District 2026", url: "https://smarter.vote/races/oh-house-12-2026/" }
              - { title: "End Dark Money: OH-12 Congressional Race", url: "https://enddarkmoney.us/oh-12-congressional-race/" }
          - name: "Jerrad Christian"
            website: "https://www.christianforohio.com/"
            priorities:
              - "Get money out of politics: end Citizens United, cap campaign spending, restrict lobbying"
              - "Protect voting rights: pass the John Lewis Voting Rights Advancement Act"
              - "Expand civil rights protections, including reproductive rights and marriage equality"
              - "Abolish ICE as it exists and prosecute agents who break the law"
              - "Universal health care"
            priority_details:
              - title: "Get money out of politics"
                summary: "End Citizens United, cap campaign spending, restrict lobbying and dark money, and ban foreign-linked groups (the site names AIPAC) from influencing officials through campaign cash."
              - title: "Protect voting rights & democracy"
                summary: "Pass the Voting Rights Act and the John Lewis Voting Rights Advancement Act to restore federal review of voting-law changes."
              - title: "Defend civil rights and equality"
                summary: "Codify expanded protections for civil rights, reproductive rights, marriage equality and religious freedom."
              - title: "Abolish & prosecute ICE"
                summary: "Abolish ICE as it exists, replace it with a narrowly tailored accountable system, and prosecute agents who break the law."
              - title: "Pass universal health care"
                summary: "Universal coverage to lower costs and untie coverage from employment."
              - title: "Raise the minimum wage"
                summary: "Raise it so full-time work pays above the poverty line; leaves the exact number and phase-in open."
              - title: "End the housing crisis"
                summary: "Build more homes, reform exclusionary zoning, incentivize first-time buyers, and crack down on large institutional home buyers."
              - title: "Reform public school funding"
                summary: "Fund schools by student need rather than local property wealth, fully fund special education and early childhood programs, and pay teachers as professionals."
              - title: "Strengthen and protect unions"
                summary: "Defend the right to organize, penalize labor-law violations, and repeal policies that weaken collective bargaining."
              - title: "Defend and restore Social Security"
                summary: "Lift or eliminate the payroll-tax cap to extend solvency without cutting benefits."
              - title: "Reduce energy costs"
                summary: "Increase supply, modernize the grid, expand renewables, nuclear and storage, and help families weatherize and cut bills."
              - title: "Expand rural internet access"
                summary: "Invest in fiber, wireless and satellite for unserved areas, with accountability for companies taking public funds."
              - title: "Support American farmers"
                summary: "Enforce antitrust law against agribusiness monopolies, strengthen the Packers and Stockyards Act, and invest in local processing and conservation."
              - title: "Protect our environment"
                summary: "Invest in conservation, protect public lands and restore habitat, framed around hunting, fishing and clean water."
              - title: "Cap Ohio's gas wells"
                summary: "Prioritize capping abandoned and orphaned wells and require bonding that covers cleanup costs."
              - title: "End corporate welfare"
                summary: "End targeted tax breaks and subsidies for profitable corporations and require clawbacks when promised jobs don't appear."
              - title: "Make the rich pay their fair share"
                summary: "Tax capital gains like wages, stop indefinite borrowing against assets to avoid tax, and make large corporations pay."
              - title: "End Israel's war in Gaza"
                summary: "Halt offensive military aid, demand a permanent ceasefire, and condition future assistance on compliance with international law."
              - title: "End Russia's war in Ukraine"
                summary: "Support Ukraine's sovereignty and seek a durable end that preserves its independence."
              - title: "Transition soldiers back home"
                summary: "Expand apprenticeship pipelines, partner with employers, improve mental health care access, and fully fund the VA."
              - title: "Regulate A.I. and data centers"
                summary: "Require transparency and accountability for AI systems and ensure data centers meet environmental standards, fair taxation and infrastructure offsets."
              - title: "Defend data privacy & online freedom"
                summary: "Require meaningful consent, limit data collection, ban the sale of sensitive data, and close law-enforcement data-purchase loopholes."
              - title: "Audit the Pentagon"
                summary: "Audit the Department of Defense, strengthen inspectors general, and penalize contractors who defraud taxpayers."
