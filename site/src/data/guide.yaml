      - id: "mental-health-levy"
        type: "ballot_issue"
        website: "https://dmmhrsb.org/levy"
        ballot_order: 22
        title: "Delaware-Morrow Mental Health & Recovery Services Board - Tax Levy (Renewal and Increase)"
        jurisdiction: "Delaware and Morrow counties"
        levy_type: "Renewal of 1.5 mills plus increase of 0.5 mill"
        ballot_language_summary:
          - "Renewal of 1.5 mills and an increase of 0.5 mill for current expenses."
          - "County auditor estimates $23,005,505 collected annually at a rate not exceeding 2 mills."
          - "$50 per $100,000 of county auditor's market value; 5 years, commencing 2027, first due in calendar year 2028."
        cost: "$50 per $100,000 per year for the full 2 mills (auditor's estimate). A supporter's letter says the increase would cost the average Delaware County homeowner an extra $6.30 a month (average-home value behind that figure not verified)."
        history: "This levy has passed every time since 2001. The 2021 renewal-plus-increase passed 26,711 to 20,559."
        what_it_funds: "Crisis hotlines, mobile crisis response, 24/7 stabilization, counseling, residential treatment, recovery housing, and school prevention programs, via partner provider agencies serving more than 25,000 residents across both counties (board's claim)."
        supporters:
          - "The board (Executive Director Deanna Brant: 'the foundation of our local mental health and addiction treatment response')"
          - "Law-enforcement voices in letters to the Delaware Gazette"
          - "Delaware County Democratic Party voter guide"
        opponents:
          - "No organized opposition found"
        arguments_for:
          - "Money is legally restricted to mental health and addiction services."
          - "Board cites increased demand and a substantial rise in staffing, residential placement, and specialty care costs over five years (Morrow County Sentinel, July 2026)."
          - "Without it, the board says providers would have to cut capacity."
          - "Also supports jail and court services."
        arguments_against:
          - "A tax increase on top of a renewal, during a period of high property taxes."
          - "Even a pro-levy letter grants the cost 'is a real cost, and it deserves thoughtful consideration.'"
          - "Some voters prefer state funding for behavioral health instead of local property taxes."
        sources:
