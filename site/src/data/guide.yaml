      - id: "transit-sales-tax"
        type: "ballot_issue"
        ballot_order: 20
        title: "Delaware County Regional Transit Authority - 0.2% Sales and Use Tax (Continuing)"
        jurisdiction: "Delaware County (excluding portions already in COTA's 1% area)"
        levy_type: "New, continuing (permanent) sales and use tax"
        ballot_language_summary:
          - "Shall a sales and use tax be levied by the Delaware County Regional Transit Authority for additional general revenues for a transit authority, a regional transportation improvement project under section 5595.06, or public infrastructure projects under section 306.353, at a rate not exceeding 0.2 per cent for a continuing period of time?"
        cost: "20 cents on a $100 taxable purchase. Not a property tax and permanent. County rate would rise from 7.0% to 7.2%. Parts of Columbus, Dublin, and Westerville already paying COTA's 1% are excluded. Powell is not in COTA's area, so Powell residents would pay it. Groceries, gasoline, utilities, and prescriptions are exempt."
        revenue_estimate:
          value: "About $16 million per year"
          verification: "calculation"
          note: "Rough scaling from the county's projected $99.9 million from its 1.25% sales tax. DCRTA's materials gave no annual figure."
        what_it_would_fund:
          - "Seven-day FLEX service in Delaware"
          - "FLEX in Orange Township"
          - "New microtransit in Powell and Liberty Township"
          - "Same-day countywide Demand Response"
          - "Vehicles"
          - "Planning for commuter service and a possible southern-county facility"
        implementation_note: "Changes would be phased in. DCT says it does not plan a return to fixed-route 'big bus' service."
        supporters:
          - "DCT board and Executive Director Andy Volenik"
        opponents:
          - "No organized opposition found"
        context:
          - "DCT says it provided 200,000+ trips last year (up 174% since 2021) and ranked third nationally for ridership growth among systems its size."
          - "DCT currently has no dedicated local funding."
        arguments_for:
          - "Creates the first stable local transit funding, serving older adults, people with disabilities, workers, and students."
          - "Out-of-county shoppers pay part of it."
          - "DCT says 0.2% would be the second-lowest transit rate among Ohio's major systems."
          - "Brings new service to Powell."
          - "Without it, DCT says it 'would likely need to reduce our staff and offerings within a year.'"
        arguments_against:
          - "It never expires, so voters never get another say."
          - "Sales taxes take a bigger share of income from lower-income households."
          - "Ballot language also allows 'regional transportation improvement' and 'public infrastructure' spending, broader than the transit-service list."
          - "Only a small share of residents may use microtransit."
        sources:
