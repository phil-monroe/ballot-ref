# Voter Guide: November 3, 2026 General Election
# Delaware County, Ohio - Precinct 154/1 (Powell City J)
#
# Structure:
#   meta:        election info, counts, caveats, global sources
#   sections[]:  ordered groups (federal, state_executive, state_legislative, judicial, county, issues)
#     contests[]:  one per ballot item, in ballot grouping order
#       type: candidate_race | ballot_issue
#       candidates[] (races): name, party, incumbent, summary, key_points, money, endorsements, support, oppose, sources
#       issue fields (issues): ballot_language, cost, supporters, opponents, arguments_for, arguments_against
#       sources[]: {title, url} - links used for that item
#       website: official URL (candidate: campaign site; contest: office or issue page). Omitted when none
#                was found; the site then shows a "No website" badge.
#       priorities: (candidates) top issues as the campaign site itself lists them, 3-5 short items, plus
#                priorities_note for provenance or when the site lists none.
#
# Neutrality: support/oppose lists are arguments made by supporters/critics, not Claude's recommendations.
# Items marked verification: "unverified" or "campaign_claim" should be labeled as such on the site.

meta:
  title: "Voter Guide: November 3, 2026 General Election"
  jurisdiction: "Delaware County, Ohio"
  precinct: "154/1 (Powell City J)"
  election_date: "2026-11-03"
  guide_compiled: "2026-10-09"
  ballot_source:
    title: "Delaware County Board of Elections official sample ballot (precinct 154___1)"
    url: "https://lookup.boe.ohio.gov/vtrapp/delaware/getballot.aspx?elect=20261103g_webeix0&prsid=154___1&bpty=X"
  counts:
    ballot_items: 22
    candidate_races: 17
    ballot_issues: 5
    uncontested_races: 4
    contested_races: 13
  not_on_this_ballot:
    - "State Board of Education"
    - "Powell City Council or township races"
    - "Olentangy school levy"
  notes:
    - "Names appear in the order printed on the ballot; Ohio rotates candidate order between precincts."
    - "Common Pleas judicial candidates appear without party labels. Appeals and Supreme Court candidates carry party labels."
    - "Every tax question on this precinct's ballot is countywide or regional."
    - "Support/oppose lists summarize arguments made by backers and critics. They are not recommendations."
  tldr:
    - "Most competitive races: Governor (Acton vs. Ramaswamy) and U.S. Senate special (Brown vs. Husted) are rated toss-ups; recent polls put the Democrats slightly ahead, mostly within the margin of error. Two Ohio Supreme Court seats decide whether the court becomes 7-0 Republican."
    - "Local taxes: Career Center renewal at a lower rate ($18 per $100,000); a new permanent 0.2% transit sales tax; a developmental disabilities levy ($63 per $100,000) returning after failing by 552 votes in May; a mental health levy renewal with an increase ($50 per $100,000). No organized 'vote no' campaign was found against any of them."
    - "Issue 3 would write Ohio's existing photo-ID voting rule into the constitution. Day-to-day voting would barely change, but the rule would be harder to alter later. Both major-party candidates for governor support it."
  caveats:
    - id: "state-senate-19-nominee"
      text: "The ballot lists Scott Charland (D) for State Senate District 19, but Janet Wagner won the May Democratic primary unopposed with 17,874 votes. No public record explaining the change was found. Verify with the Delaware County Board of Elections."
      verification: "unverified"
    - id: "minor-candidates"
      text: "Almost no reliable coverage was found for Senate candidates Greg Levy and William Redpath or Libertarian governor candidate Don Kissick; platforms are not verified."
      verification: "unverified"
    - id: "campaign-finance"
      text: "Federal figures are FEC data through June 30, 2026. Q3 reports are due Oct. 15 and will update them. No state-level finance figures were found for legislative or county races except Lorenz's 2024 total and Kulewicz's AG fundraising."
    - id: "polls"
      text: "Polls reflect late September to early October 2026. Many are within the margin of error and pollsters differ on likely vs. registered voters."
    - id: "odonnell-ethics"
      text: "Reports conflict on whether the ethics complaint against Colleen O'Donnell was dismissed or resulted in a finding of violation without sanction (Bloomberg Law carried both framings)."
    - id: "own-calculations"
      text: "The transit revenue estimate (about $16 million a year) and the DCBDD net increase (about $28 per $100,000) are rough calculations, not official figures. The county auditor's ballot figures are authoritative."
      verification: "calculation"
    - id: "levy-opposition"
      text: "No organized opposition campaigns, county Republican Party positions, or named opponents were found for the four tax levies. The 'against' arguments are common arguments in this debate, not statements from specific groups."
    - id: "property-tax-stat"
      text: "The claim that Delaware County has Ohio's highest median property tax bill ($6,896 vs. $2,396 state median, 2023) was attributed to Realtor.com/Tax Foundation data as reported by 1808 Delaware. No source link was retained; verify before publishing."
      verification: "unverified"
    - id: "secondary-sources"
      text: "Some aggregators (The Ballot Brief, Legis1, Newsweek poll roundups, Wikipedia) are secondary sources. Treat their claims accordingly."
  global_sources:
    - title: "Delaware County Board of Elections sample ballot, precinct 154___1"
      url: "https://lookup.boe.ohio.gov/vtrapp/delaware/getballot.aspx?elect=20261103g_webeix0&prsid=154___1&bpty=X"
    - title: "WOSU: Ohio 2026 election guide"
      url: "https://www.wosu.org/2026-10-06/ohio-2026-election-guide-what-voters-need-to-know-about-their-ballots"
    - title: "The Ballot Brief: Delaware County Sample Ballot & Voter Guide 2026"
      url: "https://theballotbrief.com/state/ohio/delaware-county"
    - title: "Delaware County Democratic Party 2026 Voting Guide & Slate Card"
      url: "https://ohiodeladems.org/2026-election/"

