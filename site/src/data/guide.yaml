            website: "https://actonforgovernor.com/"
            priorities:
              - "Reduce costs for families: Working Families Tax Cut, including an earned income credit and child tax credit"
              - "Clean up corruption: anti-corruption executive orders and a task force in the first 100 days"
              - "Improve education: restore public school funding to a constitutional level and reform the voucher system"
              - "Lower health care costs: Ohio Rx drug-price platform, protect Medicaid, price transparency"
              - "Grow Ohio jobs and businesses: top-to-bottom review of JobsOhio, small business and workforce training"
            priority_details:
              - title: "Reducing costs for Ohio families"
                summary: "Her stated number one priority: a Working Families Tax Cut with an earned income credit for up to 775,000 families and a child tax credit ($1,000 a year for ages 0-6, $500 for ages 7-18, for families up to $85,000)."
              - title: "Cleaning up corruption"
                summary: "Day-one anti-corruption executive orders, a task force reporting within 100 days, closing the revolving door for lobbyists in appointments, and more transparency in bidding and contracting."
              - title: "Improving Ohio's education"
                summary: "Restore public school funding to a constitutional level with the Fair School Funding Plan, reform the voucher system, and offer free school breakfast and lunch."
              - title: "Lowering the cost of health care"
                summary: "Help Ohioans stay on Medicaid, launch Ohio Rx to lower drug prices, count out-of-pocket drug costs toward deductibles, and require insurance and hospital price transparency."
              - title: "Growing Ohio jobs and businesses"
                summary: "Review JobsOhio for transparency and accountability, support small businesses, expand workforce development, and invest in broadband and transportation."
              - title: "Standing up for workers"
                summary: "Protect unions, keep Ohio from becoming a right-to-work state, and fight SB 5-style attacks on collective bargaining."
              - title: "Building safer communities"
                summary: "Fully fund police and public safety, rebuild state-local partnerships, and invest in addiction treatment and mental health services; says her opponent's property tax plan would defund first responders."
              - title: "Ensuring reproductive freedom"
                summary: "Protect access to abortion, contraception, fertility treatment and miscarriage care and defend Issue 1."
              - title: "Aging in place"
                summary: "Support family caregivers and invest in training for the long-term care workforce so seniors can stay in their homes."
              - title: "ActOn Lowering Costs: Affordability Agenda"
                summary: "Her overall cost-of-living plan covering the Working Families Tax Cut, health costs, and related measures."
              - title: "Putting Ohio consumers first"
                summary: "Executive order for rapid wage-theft case turnaround, end surprise ticket markups (HB 563, 'First Click Guarantee'), and consumer protections."
              - title: "Standing up for Ohio's LGBT community"
                summary: "Push anti-discrimination laws covering employment, housing and public accommodations."
              - title: "Lowering energy costs"
                summary: "Lower bills through the lowest-cost and cleanest sources, expand energy assistance and weatherization programs, and work with the other PJM states."
              - title: "Data centers"
                summary: "A conditional moratorium until data centers cover 100% of their utility costs, use union labor, operate transparently and meet environmental standards."
              - title: "Property tax relief"
                summary: "Expand the Homestead Exemption, raising the senior income cap to $50,000."
              - title: "Investing in Ohio's agriculture"
                summary: "Protect farmland and farmers facing eminent domain, support FFA and 4-H, and continue H2Ohio."
              - title: "Uplifting rural communities"
                summary: "Invest in rural roads, bridges, broadband and health care."
              - title: "Supporting veterans and military personnel"
                summary: "Invest in the National Guard and continue programs like the Ohio GI Promise."
              - title: "Supporting Ohio's Black communities"
                summary: "Protect early voting, create an Election Protection Liaison, and work toward equal access to education and economic opportunity."
            priorities_note: "The site lists 19 priorities; the first five in its order are shown above. Pepper's own page (meet-david) was not summarized."
            party: "Democratic"
            incumbent: false
            summary: "Acton was Ohio Department of Health director during the early COVID-19 pandemic. Pepper is a former Ohio Democratic Party chair."
            positions: ["Supports Issue 3"]
            support:
