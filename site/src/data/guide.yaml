              - { title: "Mediaite: Acton won't debate Ramaswamy", url: "https://www.mediaite.com/media/news/ohio-dem-refuses-to-debate-chronic-liar-ramaswamy-in-whats-being-called-the-ugliest-race-in-the-country/" }
          - name: "Don Kissick / James L. Mills (Lt. Gov.)"
