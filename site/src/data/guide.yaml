  # ----------------------------------------------------------------- ISSUES
  - id: "issues"
    title: "Ballot Issues"
    contests:

      - id: "state-issue-3"
        type: "ballot_issue"
        ballot_order: 18
        title: "State Issue 3 - Proposed Constitutional Amendment: Photo ID to Vote"
        jurisdiction: "Statewide"
        threshold: "Simple majority"
        ballot_language_summary:
          - "Enacts Article V, Section 5."
          - "Requires voters to present an approved form of government-issued photo ID to vote."
          - "Lets state law provide an alternative for voters with a sincere religious objection to being photographed."
          - "Requires voters who don't vote in person to provide photo ID, unless the law authorizes them to vote by providing a signature and at least one other specified unique identifier."
          - "Approved IDs: unexpired Ohio driver's license or state ID card, U.S. passport or passport card, or a U.S. military, Ohio National Guard, or VA ID card."
          - "Takes effect immediately."
        what_it_does: "Photo ID has been required to vote in person in Ohio since 2023. Issue 3 would move that requirement into the constitution; future legislatures could then change it only through another statewide vote. Day-to-day, the voting process would barely change."
        how_it_got_on_ballot: "Passed by the Republican-controlled General Assembly with a three-fifths supermajority in June 2026."
        cost: "No direct fiscal impact identified."
        supporters:
          - "Jane Timken and Sen. Theresa Gavarone (official ballot argument)"
          - "Both candidates for governor; Sec. of State candidate Robert Sprague"
          - "Tribune Chronicle editorial board"
        opponents:
          - "Allison Russo (calls it a waste of time)"
          - "Ohio Democratic Party figure DeMora (digital/biometric ID concern)"
          - "Democrats and Libertarians (Tom Pruss: absentee-voting language unclear)"
        arguments_for:
          - "Photo ID is a proven method to protect Ohio's elections and improve voter confidence. Official argument by Timken and Gavarone: 'If you can show an ID to drive a car, you can show an ID to decide the future of our state.'"
          - "Timken argues AI can easily fake utility bills and bank statements, so photo ID should be locked in."
          - "A future legislature could otherwise repeal the rule."
        arguments_against:
          - "Unnecessary because the rule is already law (Russo: 'a waste of time')."
          - "Putting specific ID types in the constitution could stop Ohio from adopting digital or biometric IDs later."
          - "Democrats and Libertarians say it is mainly meant to boost Republican turnout."
          - "Pruss warns the absentee-voting language leaves unclear what a future legislature might require."
          - "Context: no evidence of widespread voter fraud in Ohio, even before the photo ID law."
        sources:
          - { title: "NBC4: What is Issue 3?", url: "https://www.nbc4i.com/news/your-local-election-hq/what-is-issue-3-ohioans-to-decide-on-voter-id-amendment-in-november-election/" }
          - { title: "Ohio Capital Journal: What is Issue 3 on the Ohio ballot?", url: "https://ohiocapitaljournal.com/2026/07/29/what-is-issue-3-on-the-ohio-ballot/" }
          - { title: "WOWO: Ohio Issue 3 explained", url: "https://wowo.com/ohio-issue-3-explained-what-the-voter-id-amendment-would-change-on-the-2026-ballot/" }
          - { title: "WOWO: What is Ohio Issue 3?", url: "https://wowo.com/what-is-ohio-issue-3-voters-will-decide-on-constitutional-voter-id-requirement/" }
          - { title: "News 5 Cleveland: What is Issue 3 on the Ohio ballot?", url: "https://www.news5cleveland.com/news/politics/ohio-politics/what-is-issue-3-on-the-ohio-ballot" }
          - { title: "Ohio CPA: Issue 3 debate takes shape as Ohio releases official voter ID arguments", url: "https://ohiocpa.com/for-the-public/news/2026/08/21/issue-3-debate-takes-shape-as-ohio-releases-official-voter-id-arguments" }
