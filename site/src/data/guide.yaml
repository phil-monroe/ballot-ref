  - id: "state-executive"
    title: "State Executive Races"
    contests:

      - id: "governor"
        type: "candidate_race"
        ballot_order: 1
        office: "Governor / Lieutenant Governor (joint ticket)"
        term: "Four years"
        contested: true
        what_the_office_does: "Ohio's chief executive. Signs or vetoes bills, proposes the state budget, appoints agency heads, and fills judicial vacancies. Gov. Mike DeWine is term-limited. None of the three candidates for governor has held elected office."
        race_status: "Toss-up (Cook, Sabato). Polls range from Ramaswamy +2 (co/efficient, Oct. 5-6) to Acton +9 (Suffolk)."
        polls:
          - { pollster: "CNN/SSRS", result: "Acton +8" }
          - { pollster: "NYT/Siena", result: "Acton 49-45" }
          - { pollster: "Suffolk", result: "Acton 50-41" }
          - { pollster: "Marist", result: "Acton 50-44" }
          - { pollster: "co/efficient", dates: "Oct. 5-6, 2026", result: "Ramaswamy 45-43" }
          - { pollster: "BGSU", result: "Statistical tie; net favorability Ramaswamy -11, Acton -1" }
        debate_note: "Acton declined to debate Ramaswamy, calling him a 'chronic liar.'"
        candidates:
          - name: "Amy Acton / David Pepper (Lt. Gov.)"
            party: "Democratic"
            incumbent: false
            summary: "Acton was Ohio Department of Health director during the early COVID-19 pandemic. Pepper is a former Ohio Democratic Party chair."
            positions: ["Supports Issue 3"]
            support:
              - "Public-health experience"
              - "Supporters see her as steady and trustworthy"
              - "Polling strength with women and independents"
            oppose:
              - "Critics fault her pandemic-era health orders"
              - "Refused to debate Ramaswamy; critics say that denies voters a side-by-side comparison"
            sources:
              - { title: "Ironton Tribune: Two polls show Acton lead grows over Ramaswamy", url: "https://irontontribune.com/2026/10/06/two-polls-show-acton-lead-grows-over-ramaswamy/" }
              - { title: "Mediaite: Acton won't debate 'chronic liar' Ramaswamy", url: "https://www.mediaite.com/media/news/ohio-dem-refuses-to-debate-chronic-liar-ramaswamy-in-whats-being-called-the-ugliest-race-in-the-country/" }
          - name: "Vivek Ramaswamy / Robert A. McColley (Lt. Gov.)"
            party: "Republican"
            incumbent: false
            summary: "Ramaswamy is a biotech entrepreneur and billionaire, 2024 presidential candidate, and former Trump administration official. McColley is Ohio Senate President."
            positions: ["Supports Issue 3"]
            support:
              - "Business experience"
              - "Pro-growth, low-tax agenda"
              - "Running mate who knows the legislature"
            oppose:
              - "Net favorability of -11 in the BGSU poll vs. -1 for Acton"
              - "Critics question his ties to Ohio and his priorities as a national figure"
              - "NYT (Oct. 5) called it possibly the ugliest campaign in the country and reported his backers outspending Acton's on ads by more than 3-1"
