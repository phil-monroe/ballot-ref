      - id: "developmental-disabilities-levy"
        type: "ballot_issue"
        website: "https://www.dcbdd.org/levy/"
        ballot_order: 21
        title: "Delaware County Board of Developmental Disabilities - Tax Levy (Additional)"
        jurisdiction: "Delaware County"
        levy_type: "Additional (new) levy; prior levy expired"
        ballot_language_summary:
          - "An additional tax for community developmental disabilities programs and services under Chapter 5126."
          - "County auditor estimates $25,448,490 collected annually at a rate not exceeding 1.8 mills."
          - "$63 per $100,000 of county auditor's market value; 5 years, commencing 2026, first due in calendar year 2027."
        cost: "$63 per $100,000 per year."
        cost_context:
          - "The board's 2.0-mill levy (passed 2011) expired Dec. 31, 2025; last collections end Dec. 31, 2026."
          - "Delaware Gazette reported the expiring levy cost about $35.09 per $100,000, so this is roughly a $28 per $100,000 increase (own calculation)."
          - "As a new levy it probably does not get the 12.5% homeowner rollback that renewals keep (based on DACC treasurer's explanation of current law)."
        history:
          - "May 2026: a 2.7-mill renewal-plus-increase ($27.1 million a year, $65 per $100,000) failed 19,699 to 20,251 (552 votes, about 1.4%). First DCBDD levy ever to fail."
          - "This 1.8-mill request is smaller."
        supporters:
          - "DCBDD (serves 2,300+ children and adults); Board President Louis Borowicz says early intervention and other services would be cut if it fails"
          - "Focus on Abilities campaign committee (co-chairs Patricia Hollingsworth, Howard Heffelfinger)"
          - "Delaware County Democratic Party (unanimous)"
          - "Superintendent Kristine Hodge: costs are driven by the shift toward serving adults (79% of clients were children in 2016; 68% now), not enrollment growth"
        opponents:
          - "No named opposition group found; May defeat appears to reflect general tax fatigue, which the board admits it 'took for granted'"
        arguments_for:
          - "The levy is the board's main revenue source."
          - "Families say care at home would be 'very difficult, if not impossible' without it."
          - "The request was cut back after voters said no in May."
          - "Levy money can be spent only on eligible services for county residents."
        arguments_against:
          - "Bigger tax bill than the expiring levy, and loses the rollback."
          - "Comes amid frustration over property taxes and Ohio's property-tax reform debate."
          - "Some may want the board to rely more on state and federal Medicaid dollars."
        sources:
          - { title: "DCBDD: Levy", url: "https://www.dcbdd.org/levy/" }
          - { title: "DCBDD: Perspectives, October 2026", url: "https://www.dcbdd.org/perspectives/perspectives-october-2026/" }
