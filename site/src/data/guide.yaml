        type: "ballot_issue"
        website: "https://www.delawareareacc.org/"
        ballot_order: 19
        title: "Delaware Area Career Center - Tax Levy (Renewal and Decrease)"
        jurisdiction: "Delaware Area Career Center district"
        levy_type: "Renewal and decrease"
        ballot_language_summary:
          - "A renewal of part of an existing levy, being a reduction of 0.95 mill, for school buildings/facilities (not exceeding 0.40 mill) and current expenses (not exceeding 0.35 mill)."
          - "County auditor estimates $5,773,576 collected annually at a combined rate not exceeding 0.75 mill."
          - "$18 per $100,000 of county auditor's market value; 10 years, commencing 2026, first due in calendar year 2027."
        cost: "$18 per $100,000 per year. Renews a 1.7-mill levy (first passed 2001, renewed 2005 and 2015) at 0.75 mill, so homeowners would pay less than they pay for this levy today. DACC's only other levy is a 1.5-mill continuing levy from 1972."
        supporters:
          - "DACC Board and Superintendent Jay Poroda"
          - "Delaware County Democratic Party (unanimous)"
        opponents:
          - "No organized opposition found"
        arguments_for:
          - "It lowers taxes while keeping funding."
          - "As a renewal, it keeps the 12.5% homeowner rollback (rising toward 15.38%); new levies do not get it (per the treasurer's explanation)."
          - "Demand is high: more than 300 students turned away each year from main-campus programs for lack of space (Delaware Source, April 2026); enrollment grew 94%, from 725 in 2015-16 to 1,400+ in 2025-26 (Delaware Gazette)."
        arguments_against:
          - "Any property tax adds to the burden in a county with some of Ohio's highest property tax bills (see meta caveat property-tax-stat)."
          - "Some voters would rather let the levy expire and have DACC rely on its continuing levy and reserves."
          - "DACC says the levy is separate from its 100,000-sq-ft expansion (broke ground April 2026, 'funded through existing financial planning'); skeptics may note the ballot language still includes building-improvement purposes."
        sources:
          - { title: "DACC: Levy renewal with a reduction to appear on November 2026 ballot", url: "https://www.delawareareacc.org/article/3049398" }
          - { title: "DACC news", url: "https://www.delawareareacc.org/news" }
          - { title: "Delaware Source: DACC places reduced 10-year renewal levy on November ballot", url: "https://www.delawaresource.com/2026/07/28/delaware-area-career-center-places-reduced-10-year-renewal-levy-on-november-ballot/" }
          - { title: "Delaware Gazette: Career Center seeking levy renewal", url: "https://www.delgazette.com/2026/07/28/dacc-seeking-levy-renewal/" }
