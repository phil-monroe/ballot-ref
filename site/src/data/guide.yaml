sections:

  # ---------------------------------------------------------------- FEDERAL
  - id: "federal"
    title: "Federal Races"
    contests:

      - id: "us-senate-special"
        type: "candidate_race"
        ballot_order: 8
        office: "U.S. Senator"
        term: "Unexpired term ending Jan. 3, 2029"
        contested: true
        what_the_office_does: "Senators write and vote on federal laws, confirm federal judges and Cabinet officials, and ratify treaties. The winner serves the last two years of JD Vance's term."
        race_status: "Toss-up per polling roundups; recent polls show Brown slightly ahead, mostly within margin of error."
        polls:
          - { pollster: "NYT/Siena", dates: "Sept. 22 - Oct. 1, 2026", population: "616 likely voters", result: "Brown 49%, Husted 46%" }
          - { pollster: "Marist", dates: "n/a", population: "registered voters", result: "Brown 51%, Husted 43%" }
          - { pollster: "BGSU", dates: "earlier", population: "n/a", result: "Brown 49%, Husted 48%" }
        candidates:
          - name: "Jon Husted"
            party: "Republican"
            incumbent: true
            summary: "Appointed to the seat by Gov. DeWine in January 2025. Previously 20+ years as a state lawmaker and statewide officeholder, most recently Lieutenant Governor."
            money:
              - "Reported $7.7 million raised in Q2 2026 across affiliated committees, including $3.4 million in the main committee; more than $11 million cash on hand (campaign claim: largest Q2 ever for an Ohio Republican Senate candidate)."
              - "Senate Leadership Fund super PAC plans to spend $79 million on the race."
              - "Legis1 (secondary source): FEC data through Q4 2025 showed 584 unique itemized donors to his network vs. 6,700+ for Brown."
              - "Ohio Capital Journal reported two Jane Street Capital executives gave a combined $637,200 through his joint fundraising committee, Husted Victory."
            support:
              - "Long executive experience in state government"
              - "Would keep a Republican Senate seat and the Republican majority"
              - "Strong backing from business donors and national Republicans; President Trump expected to campaign for him"
            oppose:
              - "Brown's campaign ties him to Ohio's House Bill 6 bribery scandal (campaign attack; Husted was not charged in that case)"
              - "Criticized for long support of data centers"
              - "Narrower itemized donor base; large donations from a small number of executives"
            sources:
              - { title: "Ohio Capital Journal: Brown outraises Husted as outside groups enter Senate race", url: "https://ohiocapitaljournal.com/2026/07/29/sherrod-brown-comfortably-outraises-jon-husted-as-outside-groups-enter-ohios-u-s-senate-race/" }
              - { title: "Legis1: The Money Race Shaping Ohio's 2026 Senate Election (secondary)", url: "https://legis1.com/news/ohio-2026-senate-election-the-money-race-shaping" }
              - { title: "NBC4: Husted, Brown set stage for Ohio's 2026 U.S. Senate race", url: "https://www.nbc4i.com/news/your-local-election-hq/husted-brown-set-stage-for-ohios-2026-u-s-senate-race/" }
          - name: "Sherrod Brown"
            party: "Democratic"
            incumbent: false
            summary: "U.S. Senator 2007-2025; lost in 2024 to Bernie Moreno."
            money:
              - "$17.1 million raised in Q2 2026, including $14.1 million to Friends of Sherrod Brown; more than $5.1 million via ActBlue."
              - "Senate Majority PAC has committed $64 million."
            support:
              - "Long record on workers and trade"
              - "History of winning votes from both parties"
              - "Opposes data-center expansion"
              - "Heavy small-donor support"
            oppose:
              - "Husted's campaign calls him Chuck Schumer's 'handpicked candidate'"
              - "Critics say Ohio voters already rejected him in 2024 and that he would add to a Democratic majority"
              - "Critics question how grassroots his large outside money truly is"
            sources:
              - { title: "Yahoo/AP: Sherrod Brown expected to seek a return to the US Senate in 2026", url: "https://www.yahoo.com/news/articles/sherrod-brown-ohio-highest-profile-194533033.html" }
              - { title: "PBS NewsHour: Sherrod Brown expected to seek his return to the Senate in 2026", url: "https://www.pbs.org/newshour/politics/sherrod-brown-expected-to-seek-his-return-to-the-senate-in-2026" }
              - { title: "Ohio Capital Journal: Brown outraises Husted", url: "https://ohiocapitaljournal.com/2026/07/29/sherrod-brown-comfortably-outraises-jon-husted-as-outside-groups-enter-ohios-u-s-senate-race/" }
          - name: "William B. Redpath"
            party: "Libertarian"
            incumbent: false
            summary: "On the ballot. Almost no coverage found; platform not verified. Libertarian candidates generally run on smaller government and civil liberties."
            verification: "unverified"
            sources:
              - { title: "Ballot (official)", url: "https://lookup.boe.ohio.gov/vtrapp/delaware/getballot.aspx?elect=20261103g_webeix0&prsid=154___1&bpty=X" }
          - name: "Greg Levy"
            party: "Other party (as printed on ballot)"
            incumbent: false
            summary: "On the ballot. Almost no coverage found; platform not verified."
            verification: "unverified"
            sources:
              - { title: "Ballot (official)", url: "https://lookup.boe.ohio.gov/vtrapp/delaware/getballot.aspx?elect=20261103g_webeix0&prsid=154___1&bpty=X" }
        sources:
          - { title: "Newsweek: Half of Ohio voters 'strongly disapprove' of Trump as Brown opens lead", url: "https://www.newsweek.com/ohio-disapprove-donald-trump-sherrod-brown-poll-12500125" }
          - { title: "Newsweek: Sherrod Brown's polling lead defies Ohio's Republican shift", url: "https://newsweek.com/sherrod-browns-polling-lead-defies-ohios-republican-shift-12532271" }
          - { title: "StatedRecord: Ohio Senate Special Election 2026", url: "https://statedrecord.com/races/ohio-us-senate-special-2026" }
          - { title: "PollsMax: 2026 Ohio Senate Polls", url: "https://www.pollsmax.com/senate/ohio/" }
          - { title: "RealClearPolitics: Husted vs. Brown", url: "https://www.realclearpolitics.com/epolls/2026/senate/oh/2026_ohio_senate_special_election_husted_vs_brown-8689.html" }
          - { title: "WOSU: Ohio 2026 election guide", url: "https://www.wosu.org/2026-10-06/ohio-2026-election-guide-what-voters-need-to-know-about-their-ballots" }

      - id: "us-house-oh-12"
        type: "candidate_race"
        ballot_order: 9
        office: "U.S. Representative, 12th District"
        term: "Two years"
        contested: true
        what_the_office_does: "House members write federal laws, control federal spending, and represent about 800,000 constituents."
        race_status: "Cook Political Report: Solid Republican."
        candidates:
          - name: "Troy Balderson"
            party: "Republican"
            incumbent: true
            summary: "In Congress since a 2018 special election. Former state senator and representative. Third-generation auto dealer from Zanesville."
            money:
              - "FEC through June 30, 2026: $1,743,281 raised; $1,982,352 cash on hand."
            support:
              - "Experience and seniority"
              - "Conservative record that fits the district"
              - "Large financial edge"
            oppose:
              - "Democrats call him a reliable party-line vote"
              - "Campaign claim (not independently verified): only 33% of his money comes from Ohio vs. 67% of Christian's"
            sources:
              - { title: "Know Your Reps: Ohio's 12th District 2026", url: "https://knowyourreps.io/races/2026/ohio/district-12" }
              - { title: "Smarter.vote: Ohio's 12th Congressional District 2026", url: "https://smarter.vote/races/oh-house-12-2026/" }
              - { title: "End Dark Money: OH-12 Congressional Race", url: "https://enddarkmoney.us/oh-12-congressional-race/" }
          - name: "Jerrad Christian"
            party: "Democratic"
            incumbent: false
            summary: "Navy veteran and software engineer. Lost to Balderson in 2024. Won a three-way 2026 primary with 46.4% districtwide and 48.95% in Delaware County."
            money:
              - "$84,378 raised; $18,925 cash on hand."
            support:
              - "Grassroots, 'people-first' campaign"
              - "Veteran"
              - "Mostly in-state donors (campaign's claim)"
            oppose:
              - "Large money gap"
              - "Already lost to the incumbent"
              - "District leans heavily Republican"
            sources:
              - { title: "Delaware Gazette: Christian earns Democratic nomination for 12th District", url: "https://www.delgazette.com/2026/05/07/christian-earns-democratic-nomination-for-12th-congressional-district/" }
              - { title: "Smarter.vote: Jerrad Christian", url: "https://smarter.vote/races/oh-house-12-2026/jerrad-christian/" }
              - { title: "Know Your Reps: Ohio's 12th District 2026", url: "https://knowyourreps.io/races/2026/ohio/district-12" }
        sources:
          - { title: "Smarter.vote: Ohio's 12th Congressional District 2026", url: "https://smarter.vote/races/oh-house-12-2026/" }
          - { title: "Know Your Reps: Ohio's 12th District 2026", url: "https://knowyourreps.io/races/2026/ohio/district-12" }

