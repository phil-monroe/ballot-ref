ballot_text:
  title: Issue 3 Proposed Constitutional Amendment
  entity: null
  text: 'TO REQUIRE VOTERS TO PRESENT PHOTO IDENTIFICATION IN ORDER TO VOTE
    Proposed by Joint Resolution of the General Assembly To enact Section 5 of
    Article V of the Constitution of the State of Ohio A majority yes vote is
    required for the adoption of Section 5. This proposed amendment would: •
    Require voters to present an approved form of government-issued photo
    identification in order to vote. • Allow state law to provide for an
    alternative method of verifying a voter’s identity for a voter who has a
    sincere religious objection to being photographed and, therefore, does not
    possess an approved form of government-issued photo identification. •
    Require that voters who do not vote in person provide an approved form of
    government-issued photo identification, unless the law authorizes those
    persons to vote by providing a signature and at least one other specified
    unique identifier. • Define approved forms of government-issued photo
    identification as an unexpired Ohio driver license or state identification
    card; a United States passport or passport card; or a United States military
    identification card, Ohio National Guard identification card, or United
    States Department of Veterans Affairs identification card. If approved, the
    amendment shall take effect immediately. A "YES" vote means approval of the
    amendment. A "NO" vote means disapproval of the amendment. SHALL THE
    AMENDMENT BE APPROVED?'
