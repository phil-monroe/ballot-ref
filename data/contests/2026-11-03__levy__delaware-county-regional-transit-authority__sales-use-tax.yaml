ballot_text:
  title: Proposed Sales and Use Tax Delaware County Regional Transit Authority
  entity: Delaware County Regional Transit Authority
  text: A majority affirmative vote is necessary for passage. Shall a sales and
    use tax be levied by the Delaware County Regional Transit Authority for the
    purpose of providing additional general revenues for a transit authority,
    funding a regional transportation improvement project under section 5595.06
    of the Revised Code, or funding public infrastructure projects as described
    in section 306.353 of the Revised Code, and to pay the expenses of
    administering such levy at a rate not exceeding 0.2 per cent for a
    continuing period of time?
